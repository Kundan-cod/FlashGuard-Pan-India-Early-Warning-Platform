[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sih26192-imd-layer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1"]
