# =============================================================================
# DATA SOURCE MASTER REGISTRY  —  SIH 2026 PS 26192
# Flash Flood Prediction System for Hilly Regions
# =============================================================================
#
# This file is the single source of truth for external data-source metadata.
#
# CRITICAL HONESTY RULE (master prompt sections 40, 57, 62):
#   Fields marked  `verified: false`  contain PLACEHOLDER values that have NOT
#   been confirmed against official documentation. They MUST NOT be trusted,
#   quoted to judges, or used to make claims. They exist only so the schema is
#   complete and collectors have a slot to read from.
#
#   External verification is performed by ChatGPT (division of labour,
#   sections 60-63). When a verified spec arrives:
#     1. fill the real values,
#     2. set  verified: true  and add  verified_on: YYYY-MM-DD,
#     3. set  access_status  to green / yellow / red,
#     4. implement / enable the collector.
#
#   Until then every external field literally reads
#   "EXTERNAL_VERIFICATION_REQUIRED" so it is impossible to mistake a
#   placeholder for a real value.
#
# access_status:
#   green  = ChatGPT-verified AND programmatically usable now
#   yellow = usable but needs registration / manual step / license acceptance
#   red    = not currently accessible programmatically -> adapter + manual import
#   unknown= not yet verified (default for every external source)
#
# NEVER put credentials in this file. Credentials come from environment
# variables named in `auth_env_var`; see .env.example.
# =============================================================================

meta:
  project: sih26192-flash-flood
  registry_version: 1
  last_updated: "2026-09-05"
  note: >
    All external sources start unverified. Do not present any field with
    verified=false as fact. Coordinates/units policy: internal storage is
    WGS84 (EPSG:4326), rainfall in mm, water level in metres, timestamps in
    UTC. See docs/data_sources.md for the full master table.

